<text x="1102.5" y="369" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">Rmin=P(Tmin_hist≥Tmin)</text><text x="1102.5" y="398" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">RK=P(K_hist≥K)</text><text x="1102.5" y="427" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">D=max(Rmin, RK)</text>
<rect x="1280" y="265" width="255" height="240" rx="14" fill="#E8F6EE" stroke="#2E7D5B" stroke-width="2"/>
<rect x="1280" y="265" width="255" height="54" rx="14" fill="#2E7D5B"/>
