<text x="1407.5" y="369" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">历史 D 分位数</text><text x="1407.5" y="398" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">极低—高保温需求</text><text x="1407.5" y="427" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">输出两个冷位次</text>
<rect x="60" y="585" width="1480" height="180" rx="14" fill="#F6F8FA" stroke="#D8E0E8" stroke-width="2"/>
<text x="90" y="630" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="600" fill="#182230">计算公式</text>
<text x="90" y="672" font-family="Consolas, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">K=−(10×sqrt(V)+10.45−V)×(33−t)+8.55×S</text><text x="90" y="703" font-family="Consolas, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">Rmin=100×P(Tmin_hist≥Tmin)；RK=100×P(K_hist≥K)</text><text x="90" y="734" font-family="Consolas, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">D=max(Rmin, RK)</text>
