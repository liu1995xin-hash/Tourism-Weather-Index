<rect x="2045" y="900" width="500" height="52" rx="15" fill="#287753"/>
<rect x="2045" y="940" width="500" height="12" fill="#287753"/>
<text x="2295" y="935" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">结构化结果输出</text>
<text x="2295" y="999" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">UVP：连续值、UVP_raw、海拔因子、等级</text><text x="2295" y="1030" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">D：连续值、Tmin/K 冷位次、等级</text><text x="2295" y="1061" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">C：连续值、最大偏离、等级</text><text x="2295" y="1092" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">THI、K：连续值、score、等级</text><text x="2295" y="1123" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">TI：连续值、5 个子得分、权重、等级</text><text x="2295" y="1154" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">基准期、阈值、站点参数、源文件哈希</text>
<line x1="2005" y1="1200" x2="2023" y2="1200" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="60" x2="2640" y1="1820" y2="1820" stroke="#D6DEE7" stroke-width="2"/>
<text x="80" y="1866" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#607082">边界：TI 表达五项气象条件的加权综合位置；不包含降水、雷电、能见度、最大风速等旅游安全风险。UVP 为日照紫外暴露潜势，不是标准 UVI。</text>
<text x="80" y="1905" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#607082">历史基准期：1961-01-01 至 2026-07-11；TI 完整样本数：23,628 天。</text>
