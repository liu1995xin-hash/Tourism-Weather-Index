<text x="1580" y="1500" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#3C6E55">程序二读取冻结基准；不读取原始历史工作簿</text>
<rect x="1310" y="850" width="670" height="700" rx="15" fill="#F4EFFF" stroke="#6C4BA6" stroke-width="2"/>
<rect x="1310" y="850" width="670" height="52" rx="15" fill="#6C4BA6"/>
<rect x="1310" y="890" width="670" height="12" fill="#6C4BA6"/>
<text x="1645" y="885" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">综合指数 TI：子得分与权重</text>
<text x="1645" y="949" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">S_C=C</text><text x="1645" y="980" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">S_THI=100−12.5×|score_THI|</text><text x="1645" y="1011" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">S_K=100−12.5×|score_K|</text><text x="1645" y="1042" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">S_D=100−D</text><text x="1645" y="1073" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">UVP 以历史 5 档映射 S_UVP：50 / 75 / 100 / 75 / 50</text><text x="1645" y="1104" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">TI=0.35×S_C + 0.15×S_THI + 0.15×S_K</text><text x="1645" y="1135" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">   +0.20×S_D + 0.15×S_UVP</text><text x="1645" y="1166" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">权重和=1；THI、K 的直接权重各为 0.15</text><text x="1645" y="1197" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">TI 用历史阈值 21.349 / 36.745 / 58.937 / 69.944</text><text x="1645" y="1228" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">划分：极低 / 较低 / 中等 / 较高 / 高</text>
<line x1="1268" y1="1200" x2="1288" y2="1200" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
