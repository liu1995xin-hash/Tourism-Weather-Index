<text x="307" y="999" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="400" fill="#17263A">date（YYYY-MM-DD）</text><text x="307" y="1033" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="400" fill="#17263A">avg_temp=T；min_temp=Tmin</text><text x="307" y="1067" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="400" fill="#17263A">avg_rh=RH；avg_wind=V</text><text x="307" y="1101" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="400" fill="#17263A">sunshine_hours=S</text>
