<text x="2290" y="369" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">Metadata：版本、站点、源文件 SHA-256</text><text x="2290" y="400" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">Thresholds：UVP、D、TI 阈值</text><text x="2290" y="431" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">Distributions：排序后的 Tmin、K</text><text x="2290" y="462" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">Validation：有效样本数</text>
