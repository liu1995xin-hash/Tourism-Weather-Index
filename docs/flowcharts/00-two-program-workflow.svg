<rect x="105" y="1260" width="405" height="52" rx="15" fill="#A85E0C"/>
<rect x="105" y="1300" width="405" height="12" fill="#A85E0C"/>
<text x="307" y="1295" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">输入校验与日照归一</text>
<text x="307" y="1359" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#17263A">同一范围、缺测规则</text><text x="307" y="1391" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#17263A">按日期与纬度算理论昼长</text><text x="307" y="1423" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#17263A">超出昼长 +0.05 h：报错</text><text x="307" y="1455" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#17263A">否则 S=min(S, 理论昼长)</text>
<line x1="307" y1="1205" x2="307" y2="1238" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="530" y1="1395" x2="548" y2="1395" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
