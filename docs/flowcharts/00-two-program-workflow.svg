<text x="907" y="885" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">五项指数：精确计算</text>
<text x="907" y="949" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">① THI=(1.8T+32)−0.55×(1−RH/100)×(1.8T−26)</text><text x="907" y="980" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">   按既有 9 档得 score_THI∈{−8,−6,…,8}</text><text x="907" y="1011" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">② K=−(10√V+10.45−V)×(33−T)+8.55×S</text><text x="907" y="1042" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">   按既有 9 档得 score_K∈{−8,−6,…,8}</text><text x="907" y="1073" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">③ UVP_raw=100×S×sin(h₀)/14.131644</text><text x="907" y="1104" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">   sin(h₀)由 date、纬度 36.7833° 的太阳几何计算</text><text x="907" y="1135" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">   海拔因子=1+0.10×3087.6/1000=1.30876</text><text x="907" y="1166" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">   UVP=UVP_raw×1.30876</text><text x="907" y="1197" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">④ coldRank(x)=100×[n−lower_bound(历史排序分布,x)]/n</text><text x="907" y="1228" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">   D=max(coldRank(Tmin), coldRank(K))</text><text x="907" y="1259" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="400" fill="#17263A">⑤ C=100−12.5×max(|score_THI|,|score_K|)</text>
<rect x="570" y="1605" width="675" height="120" rx="15" fill="#E8F6EE" stroke="#287753" stroke-width="2"/>
<rect x="570" y="1605" width="675" height="52" rx="15" fill="#287753"/>
<rect x="570" y="1645" width="675" height="12" fill="#287753"/>
<text x="907" y="1640" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">基准加载并校验</text>
<text x="907" y="1704" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#17263A">Schema / 方法版本 / 站高 / 海拔因子 / 权重 / UVP 评分 / 分布排序 / 有效样本数</text>
