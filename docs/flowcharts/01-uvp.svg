<text x="492.5" y="301" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#182230">质量控制</text>
<text x="492.5" y="369" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">999xxx 缺测</text><text x="492.5" y="398" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">0≤S≤24</text><text x="492.5" y="427" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">理论昼长校验</text>
<rect x="670" y="265" width="255" height="240" rx="14" fill="#F1F5F9" stroke="#546274" stroke-width="2"/>
<rect x="670" y="265" width="255" height="54" rx="14" fill="#546274"/>
<rect x="670" y="305" width="255" height="14" fill="#546274"/>
<text x="797.5" y="301" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#182230">太阳几何</text>
<text x="797.5" y="369" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">固定纬度 36.7833°</text><text x="797.5" y="398" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">计算 δ、N、h</text><text x="797.5" y="427" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">UVP_base</text>
<rect x="975" y="265" width="255" height="240" rx="14" fill="#F1F5F9" stroke="#546274" stroke-width="2"/>
<rect x="975" y="265" width="255" height="54" rx="14" fill="#546274"/>
<rect x="975" y="305" width="255" height="14" fill="#546274"/>
<text x="1102.5" y="301" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#182230">海拔修正</text>
<text x="1102.5" y="369" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">H=3087.6m</text><text x="1102.5" y="398" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">A_alt=1.30876</text><text x="1102.5" y="427" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">UVP=UVP_base×A_alt</text>
<rect x="1280" y="265" width="255" height="240" rx="14" fill="#E8F6EE" stroke="#2E7D5B" stroke-width="2"/>
<rect x="1280" y="265" width="255" height="54" rx="14" fill="#2E7D5B"/>
<rect x="1280" y="305" width="255" height="14" fill="#2E7D5B"/>
<text x="1407.5" y="301" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#182230">分级输出</text>
<text x="1407.5" y="369" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">历史分位数阈值</text><text x="1407.5" y="398" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">低—高暴露潜势</text><text x="1407.5" y="427" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">输出原/修正值与因子</text>
<rect x="60" y="585" width="1480" height="180" rx="14" fill="#F6F8FA" stroke="#D8E0E8" stroke-width="2"/>
<text x="90" y="630" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="23" font-weight="600" fill="#182230">计算公式</text>
<text x="90" y="672" font-family="Consolas, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">decl=23.45×sin(2×pi×(284+d)/365)；N=(24/pi)×arccos(-tan(lat)×tan(decl))</text><text x="90" y="703" font-family="Consolas, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">h=arcsin(sin(lat)×sin(decl)+cos(lat)×cos(decl))；lat=36.7833</text><text x="90" y="734" font-family="Consolas, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="400" fill="#182230">UVP=(100×S_adj×sin(h)/14.131644170491846)×1.30876</text>
